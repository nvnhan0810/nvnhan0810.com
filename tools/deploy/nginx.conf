# Install as /etc/nginx/conf.d/tools.nvnhan0810.com.conf, then nginx -t and reload.
server {
    listen 80;
    server_name tools.nvnhan0810.com;
    root /home/nvnhan0810/www/nvnhan0810.com/tools/dist;
    index index.html;
    client_max_body_size 16M;
    auth_basic off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # This is a multi-page site: resolve /agent/ to /agent/index.html.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Missing JavaScript must return 404, never the home page's HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
