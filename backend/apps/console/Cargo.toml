[package]
name = "console"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
autobins = false

[dependencies]
app-config = { path = "../../crates/app-config" }
identity = { path = "../../modules/identity" }
tokio.workspace = true
foreign = { path = "../../modules/foreign" }
uuid.workspace = true
sqlx.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum.workspace = true
serde_json.workspace = true
url = "2"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "console"
path = "src/main.rs"
