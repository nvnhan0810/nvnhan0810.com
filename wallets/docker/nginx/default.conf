server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # K8s / local health (no path prefix)
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Static files under /wallets/* → public/*
    location ~ ^/wallets/(build|images|storage|favicon\.ico|robots\.txt|sw\.js)(/.*)?$ {
        rewrite ^/wallets/(.*)$ /$1 break;
        root /var/www/html/public;
        access_log off;
    }

    # App (Laravel routes are prefixed /wallets)
    location /wallets {
        try_files $uri /index.php?$query_string;
    }

    # Fallback for cluster probes / legacy root
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
