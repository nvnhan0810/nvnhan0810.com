name: Deploy Tools

on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: bash -n deploy.sh
      - run: npm ci --include=dev
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tools-dist
          path: tools/dist/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger deploy webhook
        shell: bash
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_TOKEN="${DEPLOY_HOOK_TOKEN:-$DEPLOY_WEBHOOK_TOKEN}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo '::error::Set DEPLOY_HOOK_TOKEN or DEPLOY_WEBHOOK_TOKEN to call the deploy API.'
            exit 1
          fi
          curl -fsS --connect-timeout 10 --max-time 30 \
            -X POST 'https://deploy.nvnhan0810.com/deploy' \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repo":"nvnhan0810_com_tools"}'
          echo 'Deploy webhook sent for nvnhan0810_com_tools.'
