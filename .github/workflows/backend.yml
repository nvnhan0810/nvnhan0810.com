name: Publish Backend image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, only trigger deploy webhook'
        type: boolean
        default: false
      image_tag:
        description: '7-char commit SHA when deploy_only=true. Empty = current commit SHA.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  DEPLOY_REPO: ${{ vars.BACKEND_DEPLOY_REPO || 'backend' }}
  DEPLOY_TAG: production

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: image
        env:
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          TAG="${GITHUB_SHA:0:7}"
          if [ "$DEPLOY_ONLY" = "true" ] && [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          elif [ "$DEPLOY_ONLY" != "true" ] && [ -n "$REQUESTED_TAG" ]; then
            echo '::error::image_tag can only be supplied with deploy_only=true.'
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo '::error::image_tag must be exactly 7 lowercase hexadecimal characters.'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      - name: Trigger deploy webhook
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          DEPLOY_TOKEN="${DEPLOY_HOOK_TOKEN:-$DEPLOY_WEBHOOK_TOKEN}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo '::error::Set DEPLOY_HOOK_TOKEN or DEPLOY_WEBHOOK_TOKEN to call the deploy API.'
            exit 1
          fi
          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"repo": os.environ["DEPLOY_REPO"], "tag": os.environ["DEPLOY_TAG"], "image": os.environ["IMAGE"], "image_tag": os.environ["IMAGE_TAG"]}))')
          curl -fsS --max-time 30 -X POST 'https://deploy.nvnhan0810.com/deploy' \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
          echo "Deploy webhook sent for ${IMAGE}:${IMAGE_TAG}"
          echo "Deployed image: ${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
