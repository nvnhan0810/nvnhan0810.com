[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

# Web pod only: php-fpm + nginx + Inertia SSR.
# Queue worker and scheduler run as separate K8s Deployment / CronJob
# (see ~/www/k3s/apps/nvnhan0810.com/deployment-queue.yaml + cronjob-scheduler.yaml).

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inertia-ssr]
process_name=%(program_name)s
command=/usr/bin/node /var/www/html/bootstrap/ssr/ssr.js
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
